[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbstudy"
version = "1.0.0"
description = "Does lung segmentation help TB detection on chest X-rays? A matched U-Net + ResNet-18 study (reimplementation)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Adnan Haider" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "scikit-image>=0.20",
    "opencv-python-headless>=4.7",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
